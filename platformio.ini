; Cardputer-Adv 开发配置
; 官方文档指定 PlatformIO 的开发板选 esp32-s3-devkitc-1（不是 m5stack-* 系列）

[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 这个目标只编译 Cardputer 专属入口；共享逻辑留在 lib/ 下供两个目标复用。
build_src_filter =
    +<*>
    -<stackchan/>

; 8MB Flash，无 PSRAM（ESP32-S3FN8）
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; 曲库挂在分区表的 spiffs 分区（0x670000 起、1.5MB）上，用 LittleFS 格式
board_build.filesystem = littlefs

; 串口用通配符匹配，这样换台机器 / 换个 USB 口都不用改。
; 不能留空靠 PlatformIO 自动探测：macOS 上它会挑中 /dev/cu.Bluetooth-Incoming-Port
; 然后卡死（实测过）。ESP32-S3 是原生 USB，macOS 下形如 /dev/cu.usbmodem101。
; Linux 改成 /dev/ttyACM*，Windows 改成具体的 COMx。
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    ; M5Cardputer 依赖的 IRremote 在库注册表里有 7 个同名包，必须指明作者
    z3t0/IRremote@^4.7.1
    ; BLE HID 遥控器。用 NimBLE 而不是框架自带的 BLE 库（Bluedroid）：
    ; 官方说法是少 50% flash、少约 100KB RAM，而我们的固件已经用掉 31.7%。
    h2zero/NimBLE-Arduino@^2.5.1

; 和 native 测试环境保持同一个 C++ 标准，避免「Mac 上测过的代码在板子上编不过」。
; 必须先 unflag：espressif32 平台会在我们的 flag 之后再追加 -std=gnu++11，
; 而 gcc 取最后一个 -std，所以只加 build_flags 是无效的（实测过）。
build_unflags = -std=gnu++11

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17

; 设备上不跑测试（测试只在 Mac 的 native 环境跑）
test_ignore = *


; ── StackChan Core + Faces Bottom3 / Keyboard3 背词机 ────────
; StackChan 专用 Core 的硬件与普通 CoreS3 有细微差异，M5Unified 会自动识别它；
; PlatformIO 暂无 StackChan 专属 board definition，因此用兼容的 CoreS3 16MB 目标。
[env:stackchan-vocab]
platform = espressif32@7.1.3
board = m5stack-cores3
framework = arduino

build_src_filter =
    -<*>
    +<stackchan/>
    +<ipa_text.cpp>

; StackChan Core：16MB Flash / 8MB PSRAM；词库仍由程序内置，不依赖文件系统。
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
    https://github.com/m5stack/M5Faces.git#28188e1820113a2caf1c21b3a948f574f3e535fe

build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I .pio/libdeps/stackchan-vocab/M5Unified/src
    -std=gnu++17

test_ignore = *


; ── 在 Mac 上跑 lib/music 的单元测试，不碰 Arduino ──────────
; 用法：pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
