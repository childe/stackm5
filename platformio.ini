; Cardputer-Adv 开发配置
; 官方文档指定 PlatformIO 的开发板选 esp32-s3-devkitc-1（不是 m5stack-* 系列）

[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 8MB Flash，无 PSRAM（ESP32-S3FN8）
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; 曲库挂在分区表的 spiffs 分区（0x670000 起、1.5MB）上，用 LittleFS 格式
board_build.filesystem = littlefs

; 串口用通配符匹配，这样换台机器 / 换个 USB 口都不用改。
; 不能留空靠 PlatformIO 自动探测：macOS 上它会挑中 /dev/cu.Bluetooth-Incoming-Port
; 然后卡死（实测过）。ESP32-S3 是原生 USB，macOS 下形如 /dev/cu.usbmodem101。
; Linux 改成 /dev/ttyACM*，Windows 改成具体的 COMx。
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    ; M5Cardputer 依赖的 IRremote 在库注册表里有 7 个同名包，必须指明作者
    z3t0/IRremote@^4.7.1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; 和 native 测试环境保持同一个标准，避免「Mac 上测过的代码在板子上编不过」
    -std=gnu++17

; 设备上不跑测试（测试只在 Mac 的 native 环境跑）
test_ignore = *


; ── 在 Mac 上跑 lib/jianpu 的单元测试，不碰 Arduino ──────────
; 用法：pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
